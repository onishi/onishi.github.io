<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>きのこの山 vs たけのこの里 投票</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    /* ベースのリセットとフォント設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', 'Meiryo', sans-serif;
      user-select: none;
    }

    /* 背景レイヤー */
    #bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    /* 物理演算キャンバス */
    #world {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none; /* UIのクリックを妨げない */
    }

    /* UIレイヤー */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none; /* 子要素のみクリック可能にする */
    }

    /* ヘッダー部分 */
    .header {
      display: flex;
      width: 100%;
      padding-top: 30px;
      position: relative;
    }
    .title {
      flex: 1;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #333;
      letter-spacing: 2px;
    }

    /* VS バッジ */
    .vs-badge {
      position: absolute;
      left: 50%;
      top: 15px;
      transform: translateX(-50%);
      width: 90px;
      height: 90px;
      background-color: #aaeaff;
      /* ギザギザの星型 */
      clip-path: polygon(50% 0%, 61% 25%, 88% 18%, 76% 41%, 100% 59%, 76% 71%, 82% 98%, 59% 82%, 35% 98%, 38% 71%, 10% 63%, 30% 44%, 12% 18%, 38% 25%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff5281;
      font-size: 38px;
      font-weight: bold;
      font-style: italic;
    }

    /* フッター背景（水色部分） */
    .footer-bg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 140px;
      background-color: #a3e8ff;
      z-index: -2;
    }

    /* フッターのスコアとボタン */
    .footer {
      display: flex;
      width: 100%;
      height: 140px;
      padding-bottom: 20px;
      pointer-events: auto; /* ここはクリック可能 */
    }
    .action-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }
    .score {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    #score-kinoko { color: #f2726f; } /* 画像のピンク系赤 */
    #score-takenoko { color: #1898a3; } /* 画像の青緑系 */

    .btn {
      padding: 12px 35px;
      border-radius: 40px;
      border: none;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 0 4px 0px rgba(0,0,0,0.15);
      color: #333;
      font-family: inherit;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .btn-kinoko {
      background-color: #d8b76b; /* 黄土色 */
    }
    .btn-takenoko {
      background-color: #17b3a3; /* エメラルドグリーン */
      color: white;
    }

    /* レスポンシブ対応 */
    @media (max-width: 600px) {
      .title { font-size: 20px; }
      .vs-badge { width: 60px; height: 60px; font-size: 24px; top: 18px; }
      .btn { padding: 10px 20px; font-size: 14px; }
      .score { font-size: 28px; }
      .footer { height: 110px; }
      .footer-bg { height: 110px; }
    }
  </style>
</head>
<body>

  <!-- 背景とイラスト (SVG) -->
  <svg id="bg-layer" preserveAspectRatio="xMidYMax slice" viewBox="0 0 1600 900">
    <!-- 空の背景色 -->
    <rect x="0" y="0" width="800" height="900" fill="#dbed66" />
    <rect x="800" y="0" width="800" height="900" fill="#5ad87a" />
    
    <!-- きのこの山の背景イラスト -->
    <ellipse cx="300" cy="800" rx="450" ry="300" fill="#1cb6a3" />
    <ellipse cx="50" cy="850" rx="200" ry="150" fill="#58d0c2" />
    <ellipse cx="650" cy="820" rx="300" ry="200" fill="#2bbda9" />
    
    <!-- きのこの山側の木 -->
    <g transform="translate(200, 680)">
      <rect x="-4" y="0" width="8" height="30" fill="#4e3422"/>
      <circle cx="0" cy="-10" r="18" fill="#1b5e20"/>
      <circle cx="-12" cy="5" r="14" fill="#1b5e20"/>
      <circle cx="12" cy="5" r="14" fill="#1b5e20"/>
    </g>
    <g transform="translate(350, 720)">
      <rect x="-3" y="0" width="6" height="25" fill="#4e3422"/>
      <circle cx="0" cy="-8" r="15" fill="#1b5e20"/>
    </g>
    <g transform="translate(500, 650)">
      <rect x="-5" y="0" width="10" height="40" fill="#4e3422"/>
      <circle cx="0" cy="-15" r="22" fill="#1b5e20"/>
      <circle cx="-15" cy="8" r="18" fill="#1b5e20"/>
      <circle cx="15" cy="8" r="18" fill="#1b5e20"/>
    </g>

    <!-- たけのこの里の背景イラスト -->
    <ellipse cx="1300" cy="800" rx="450" ry="300" fill="#0c7769" />
    <ellipse cx="950" cy="850" rx="250" ry="200" fill="#138d7f" />
    <ellipse cx="1550" cy="820" rx="200" ry="150" fill="#1aa192" />
    
    <!-- たけのこの里側の竹林 -->
    <g transform="translate(1100, 650)">
      <rect x="-4" y="-50" width="8" height="70" fill="#a4ce74"/>
      <rect x="-5" y="-30" width="10" height="3" fill="#689f38"/>
      <rect x="-5" y="-10" width="10" height="3" fill="#689f38"/>
      <path d="M4,-40 Q15,-48 20,-35 Q10,-30 4,-35 Z" fill="#8bc34a"/>
    </g>
    <g transform="translate(1250, 700)">
      <rect x="-5" y="-40" width="10" height="60" fill="#a4ce74"/>
      <rect x="-6" y="-20" width="12" height="3" fill="#689f38"/>
      <rect x="-6" y="0" width="12" height="3" fill="#689f38"/>
      <path d="M-5,-15 Q-20,-25 -25,-10 Q-15,-5 -5,-10 Z" fill="#8bc34a"/>
    </g>
    <g transform="translate(1400, 620)">
      <rect x="-6" y="-70" width="12" height="90" fill="#a4ce74"/>
      <rect x="-7" y="-50" width="14" height="4" fill="#689f38"/>
      <rect x="-7" y="-25" width="14" height="4" fill="#689f38"/>
      <path d="M6,-60 Q25,-70 30,-50 Q15,-40 6,-50 Z" fill="#8bc34a"/>
      <path d="M-6,-40 Q-20,-50 -25,-35 Q-15,-30 -6,-35 Z" fill="#8bc34a"/>
    </g>
  </svg>

  <!-- 物理演算描画用キャンバス -->
  <canvas id="world"></canvas>

  <!-- UI要素 -->
  <div class="ui-layer">
    <div class="header">
      <div class="title">きのこの山</div>
      <div class="vs-badge">VS</div>
      <div class="title">たけのこの里</div>
    </div>
    
    <div class="footer-bg"></div>
    
    <div class="footer">
      <div class="action-area">
        <div class="score" id="score-kinoko">14</div>
        <button class="btn btn-kinoko" onclick="voteKinoko()">きのこの山がうまい！</button>
      </div>
      <div class="action-area">
        <div class="score" id="score-takenoko">16</div>
        <button class="btn btn-takenoko" onclick="voteTakenoko()">たけのこの里がうまい！</button>
      </div>
    </div>
  </div>

  <script>
    // --- キャンバスとコンテキストの準備 ---
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');
    
    // --- Matter.js のセットアップ ---
    const Engine = Matter.Engine,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite,
          Body = Matter.Body;

    const engine = Engine.create();
    
    // 壁や床を格納する変数
    let ground, wallLeft, wallRight, wallCenter;
    
    // --- リサイズ・解像度対応 ---
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;
      
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      
      ctx.setTransform(1, 0, 0, 1, 0, 0); // リセット
      ctx.scale(dpr, dpr);
      
      // フッターの高さ(レスポンシブ対応)
      const footerHeight = width <= 600 ? 110 : 140;

      // 物理空間の壁と床の再設定
      if(ground) Composite.remove(engine.world, [ground, wallLeft, wallRight, wallCenter]);
      
      const thick = 100;
      ground = Bodies.rectangle(width / 2, height - footerHeight + thick / 2, 10000, thick, { isStatic: true });
      wallLeft = Bodies.rectangle(-thick/2, height / 2, thick, height * 2, { isStatic: true });
      wallRight = Bodies.rectangle(width + thick/2, height / 2, thick, height * 2, { isStatic: true });
      wallCenter = Bodies.rectangle(width / 2, height / 2, 20, height * 2, { isStatic: true }); // 中央の透明な仕切り
      
      Composite.add(engine.world, [ground, wallLeft, wallRight, wallCenter]);
    }
    
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas(); // 初回実行

    // --- お菓子の生成関数 ---
    const scale = 1.3; // 全体的なサイズの調整

    function spawnKinoko(x, y) {
      const body = Bodies.circle(x, y, 12 * scale, {
        restitution: 0.4,
        friction: 0.8,
        density: 0.05,
        render: { customType: 'kinoko' }
      });
      // 初期角度をランダムに
      Body.setAngle(body, Math.random() * Math.PI * 2);
      Composite.add(engine.world, body);
    }

    function spawnTakenoko(x, y) {
      // 三角形のポリゴン
      const body = Bodies.polygon(x, y, 3, 14 * scale, {
        restitution: 0.3,
        friction: 0.8,
        density: 0.05,
        render: { customType: 'takenoko' }
      });
      // 上向きになるように調整しつつ、少しランダムに傾ける
      Body.setAngle(body, -Math.PI / 2 + (Math.random() - 0.5));
      Composite.add(engine.world, body);
    }

    // --- 投票アクション ---
    function voteKinoko() {
      const el = document.getElementById('score-kinoko');
      el.innerText = parseInt(el.innerText) + 1;
      
      // 左半分のランダムな位置から降らせる
      const x = Math.random() * (window.innerWidth / 2 - 100) + 50;
      spawnKinoko(x, -50);
    }

    function voteTakenoko() {
      const el = document.getElementById('score-takenoko');
      el.innerText = parseInt(el.innerText) + 1;
      
      // 右半分のランダムな位置から降らせる
      const x = window.innerWidth / 2 + Math.random() * (window.innerWidth / 2 - 100) + 50;
      spawnTakenoko(x, -50);
    }

    // --- 初期のアニメーション ---
    window.onload = () => {
      // 画面上のスコアの数だけ初期配置で降らせる
      const targetK = parseInt(document.getElementById('score-kinoko').innerText);
      const targetT = parseInt(document.getElementById('score-takenoko').innerText);
      
      for(let i=0; i<targetK; i++) {
        setTimeout(() => {
          const x = Math.random() * (window.innerWidth / 2 - 100) + 50;
          spawnKinoko(x, -50);
        }, i * 100 + Math.random() * 50);
      }
      for(let i=0; i<targetT; i++) {
        setTimeout(() => {
          const x = window.innerWidth / 2 + Math.random() * (window.innerWidth / 2 - 100) + 50;
          spawnTakenoko(x, -50);
        }, i * 100 + Math.random() * 50);
      }
    };

    // --- 自前レンダリング関数 (Canvas API) ---
    function drawKinoko(x, y, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      
      // 柄 (クラッカー部分)
      ctx.fillStyle = '#fce4a1';
      ctx.fillRect(-3.5 * scale, 0, 7 * scale, 15 * scale);
      
      // 傘 (チョコ部分)
      ctx.fillStyle = '#4e3422';
      ctx.beginPath();
      // 半円
      ctx.arc(0, 2 * scale, 11 * scale, Math.PI, 0);
      ctx.fill();
      // 傘の下部の丸み
      ctx.beginPath();
      ctx.ellipse(0, 2 * scale, 11 * scale, 3 * scale, 0, 0, Math.PI);
      ctx.fill();
      
      ctx.restore();
    }

    function drawTakenoko(x, y, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      
      // クッキー部分 (下)
      ctx.fillStyle = '#e5c479';
      ctx.beginPath();
      ctx.moveTo(-6 * scale, 6 * scale);
      ctx.lineTo(6 * scale, 6 * scale);
      ctx.lineTo(4 * scale, 13 * scale);
      ctx.lineTo(-4 * scale, 13 * scale);
      ctx.fill();
      
      // チョコ部分 (上、三角形)
      ctx.fillStyle = '#4e3422';
      ctx.beginPath();
      ctx.moveTo(0, -12 * scale); // 頂点
      ctx.lineTo(8 * scale, 6 * scale); // 右下
      ctx.lineTo(-8 * scale, 6 * scale); // 左下
      ctx.fill();
      
      ctx.restore();
    }

    // --- 物理演算と描画のメインループ ---
    (function renderLoop() {
      // 物理エンジンのステップを進める
      Engine.update(engine, 1000 / 60);
      
      // キャンバスのクリア
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // 全てのオブジェクトを描画
      const bodies = Composite.allBodies(engine.world);
      for (let body of bodies) {
        if (!body.render.customType) continue; // 壁や床は描画しない
        
        const pos = body.position;
        const angle = body.angle;
        
        if (body.render.customType === 'kinoko') {
          drawKinoko(pos.x, pos.y, angle);
        } else if (body.render.customType === 'takenoko') {
          drawTakenoko(pos.x, pos.y, angle);
        }
      }
      
      requestAnimationFrame(renderLoop);
    })();

  </script>
</body>
</html>
